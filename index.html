<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06090b">
<title>새벽 3시 17분 — 리얼 방탈출 스릴러</title>
<style>
:root{
  --bg:#06090b; --panel:#0b1215; --panel2:#0e171b; --line:#1b2a2f;
  --txt:#dde8ea; --mut:#8fa4aa; --acc:#7fd3dd; --acc2:#a8e4ea;
  --warm:#d9b18c; --danger:#c98b7c;
  --ar:1.7778;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%,#0e171a 0%,#05080a 55%,#000 100%);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,"Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  overflow:hidden;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.screen[hidden]{display:none!important}

/* ───────── 연령 확인 ───────── */
#gate{overflow-y:auto;align-items:center;justify-content:flex-start;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.gate-inner{width:100%;max-width:460px;margin:auto;background:linear-gradient(180deg,rgba(16,26,30,.92),rgba(8,12,14,.96));
  border:1px solid var(--line);border-radius:18px;padding:26px 22px 22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.gate-kicker{margin:0 0 10px;font-size:10px;letter-spacing:.32em;color:var(--acc);opacity:.85}
#gate h1{margin:0 0 6px;font-size:27px;letter-spacing:-.02em;font-weight:800}
.gate-lead{margin:0 0 20px;font-size:13.5px;color:var(--mut);line-height:1.55}
.notice{border:1px solid #23343a;background:rgba(10,18,21,.75);border-radius:12px;padding:13px 14px;margin-bottom:20px}
.notice p{margin:0 0 8px;font-size:12px;line-height:1.65;color:#9fb3b8}
.notice p:last-child{margin-bottom:0}
.notice b{color:#cfe4e7;font-weight:600}
.notice .warn{color:#d8a898}
.gate-label{display:block;font-size:11px;letter-spacing:.12em;color:var(--mut);margin-bottom:7px}
#dob{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #2a3d44;background:#070c0e;color:var(--txt);
  font-size:17px;letter-spacing:.08em;outline:none;font-variant-numeric:tabular-nums}
#dob:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(127,211,221,.12)}
.gate-msg{min-height:18px;margin:9px 0 0;font-size:12px;line-height:1.5;color:var(--danger)}
.gate-msg.ok{color:var(--acc)}
.btn{display:block;width:100%;padding:15px 16px;border-radius:12px;font-size:15px;font-weight:700;letter-spacing:-.01em;
  border:1px solid #2a3d44;background:#0e181c;color:var(--txt);margin-top:12px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(180deg,#1a2c31,#132227);border-color:#37545c;color:#eaf7f9}
.btn.primary:disabled{opacity:.4;filter:grayscale(.6)}
.btn.danger{color:#e6b6a6;border-color:#4a3230}

/* ───────── 게임 HUD ───────── */
#game{position:relative}
#hud{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;min-height:42px;
  border-bottom:1px solid rgba(27,42,47,.7);background:rgba(5,9,11,.9)}
#chapter{font-size:11px;letter-spacing:.16em;color:var(--acc);white-space:nowrap;opacity:.9}
#tensionWrap{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:9.5px;color:var(--mut);letter-spacing:.1em}
#tensionBar{width:56px;height:4px;border-radius:3px;background:#16242a;overflow:hidden}
#tensionBar i{display:block;height:100%;width:12%;background:linear-gradient(90deg,#4c8f98,#c98b7c);transition:width .6s ease}
.hud-btns{display:flex;gap:5px}
.hud-btns button{font-size:10.5px;padding:5px 8px;border-radius:8px;border:1px solid #24363c;background:#0c151a;color:#a9bec3;letter-spacing:-.01em}
.hud-btns button:active{background:#132329}
.hud-btns button.on{color:var(--acc);border-color:#35606a}

/* ───────── 무대 ───────── */
#stage{flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0}
#scene{position:relative;flex:0 0 auto;width:100%;max-width:100%;aspect-ratio:var(--ar);
  overflow:hidden;background:#000;border-bottom:1px solid rgba(27,42,47,.6);cursor:crosshair}
#layer{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
#layer.zoom{transform:scale(1.7)}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
#bg.fadein{animation:sceneIn .6s ease}
@keyframes sceneIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,transparent 22%,transparent 62%,rgba(0,0,0,.45) 100%)}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;
  padding:5px 9px 5px 7px;border-radius:999px;background:rgba(6,14,17,.62);border:1px solid rgba(127,211,221,.42);
  color:#dff1f4;font-size:10.5px;line-height:1;letter-spacing:-.01em;white-space:nowrap;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 3px 12px rgba(0,0,0,.45);
  transition:background .2s,border-color .2s,opacity .3s}
.hs::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc);box-shadow:0 0 7px var(--acc);flex:0 0 auto}
.hs:active{background:rgba(30,70,78,.9);border-color:var(--acc)}
.hs.seen{opacity:.5}
.hs.seen::before{background:#5f7d84;box-shadow:none}
.hs.hot{border-color:rgba(217,177,140,.65)}
.hs.hot::before{background:var(--warm);box-shadow:0 0 7px var(--warm)}

/* ───────── 인벤토리 ───────── */
#inventory{width:100%;max-width:1100px;display:flex;gap:7px;padding:8px 12px 4px;overflow-x:auto;align-items:center;
  min-height:44px;scrollbar-width:none}
#inventory::-webkit-scrollbar{display:none}
.inv-empty{font-size:10.5px;color:#546a71;letter-spacing:.04em}
.inv-item{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:9px;border:1px solid #24363c;
  background:#0b1418;font-size:11px;color:#c6d8db;flex:0 0 auto}
.inv-item span.ic{font-size:13px;line-height:1}
.inv-item:active{border-color:var(--acc)}

/* ───────── 대사창 ───────── */
#dialogue{width:100%;max-width:1100px;flex:1;min-height:118px;display:flex;flex-direction:column;
  padding:2px 14px calc(8px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
#speaker{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--acc);margin-bottom:5px;min-height:14px}
#speaker.me{color:#9fb4ba;font-weight:600}
#speaker.voice{color:#d8b58f}
#speaker.cop{color:#a9bdd2}
#speaker.hint{color:#7fa8b0}
#speaker.sys{color:#8fa4aa;letter-spacing:.14em;font-size:10px}
#line{font-size:14px;line-height:1.72;color:#e2edef;letter-spacing:-.01em;white-space:pre-wrap;flex:1;overflow-y:auto;
  max-height:150px;scrollbar-width:none}
#line::-webkit-scrollbar{display:none}
#line.idle{color:#7e9399;font-style:normal}
#line .dim{color:#94a9af}
#dlgBtns{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:44vh;overflow-y:auto}
.choice{width:100%;text-align:left;padding:11px 13px;border-radius:10px;border:1px solid #2b4148;background:rgba(13,23,27,.95);
  font-size:12.5px;line-height:1.45;color:#d7e8ea;transition:background .15s,border-color .15s}
.choice:active{background:#16303a;border-color:var(--acc)}
.choice i{display:inline-block;font-style:normal;color:var(--acc);margin-right:7px;font-size:11px}
#dlgNext{position:absolute;right:16px;bottom:calc(6px + env(safe-area-inset-bottom));font-size:10px;color:var(--acc);
  opacity:0;transition:opacity .3s;pointer-events:none}
#dlgNext.on{opacity:.75;animation:bob 1.6s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
#dialogue.tap{cursor:pointer}

/* ───────── 모달 ───────── */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(2,4,5,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .22s ease}
.modal[hidden]{display:none!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-inner{position:relative;width:100%;max-width:430px;max-height:88dvh;overflow-y:auto;border-radius:16px;
  border:1px solid var(--line);background:linear-gradient(180deg,#0d1619,#080d0f);padding:20px 18px;
  box-shadow:0 24px 70px rgba(0,0,0,.75);animation:rise .25s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
#modalClose{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;border:1px solid #26383e;
  background:#0b1519;color:#9fb3b8;font-size:13px;line-height:1}
.m-title{margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:-.01em;padding-right:30px}
.m-sub{margin:0 0 14px;font-size:11.5px;color:var(--mut);line-height:1.6}
.m-text{font-size:12.5px;line-height:1.75;color:#cfdee1;white-space:pre-wrap;margin:0 0 14px}
.modal-img{width:100%;border-radius:10px;display:block;margin:0 0 12px;border:1px solid #1d2c31}
.clue{border-left:2px solid #35545c;padding:2px 0 2px 11px;margin-bottom:14px}
.clue b{display:block;font-size:12px;color:var(--acc);margin-bottom:3px;font-weight:600}
.clue span{font-size:11.5px;line-height:1.65;color:#a9bcc1}

/* 키패드 */
.kp{text-align:center}
.kp-screen{font-variant-numeric:tabular-nums;font-size:30px;letter-spacing:.34em;padding:14px 0 12px;margin-bottom:14px;
  border-radius:11px;border:1px solid #2a4249;background:#050b0d;color:var(--acc);min-height:60px;
  text-shadow:0 0 16px rgba(127,211,221,.45)}
.kp-screen.err{color:#d98f7e;text-shadow:0 0 16px rgba(217,143,126,.4);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{padding:15px 0;border-radius:10px;border:1px solid #26393f;background:#0d181c;font-size:17px;color:#d3e3e6}
.keys button:active{background:#173039;border-color:var(--acc)}
.keys button.wide{font-size:12.5px;letter-spacing:.06em;color:#b9ccd0}

/* 발권기 */
.kiosk{border-radius:14px;border:1px solid #2c444b;background:linear-gradient(180deg,#0a2429,#061417);padding:14px 13px}
.kiosk-top{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;letter-spacing:.16em;color:#79c4cc;margin-bottom:12px}
.kiosk-title{font-size:14px;font-weight:700;margin:0 0 4px}
.kiosk-hint{font-size:10.5px;color:#7e9aa1;margin:0 0 13px;line-height:1.5}
.dest{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 12px;border-radius:10px;
  border:1px solid #2a4047;background:#08191d;margin-bottom:8px;text-align:left}
.dest .d1{display:block;font-size:13px;color:#e2eef0}
.dest .d2{display:block;font-size:10px;color:#82a0a7;margin-top:3px;letter-spacing:.02em}
.err-msg{color:#c98b7c!important}
.dest .d3{font-size:13px;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.dest:active{background:#0f2a30;border-color:var(--acc)}
.dest.off{opacity:.42}
.dest.off .d3{color:#c98b7c}
.ticket{border-radius:12px;background:linear-gradient(160deg,#1b2b30,#0d1a1e);border:1px solid #3a565e;
  padding:14px 15px;position:relative;overflow:hidden;margin-bottom:14px}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:repeating-linear-gradient(90deg,#7fd3dd 0 14px,transparent 14px 24px);opacity:.5}
.ticket .t1{font-size:9.5px;letter-spacing:.24em;color:#8fb9c0;margin-bottom:9px}
.ticket .t2{font-size:19px;font-weight:800;margin-bottom:10px;letter-spacing:-.02em}
.ticket .row{display:flex;justify-content:space-between;font-size:11px;color:#a8bcc1;padding:3px 0;font-variant-numeric:tabular-nums}
.ticket .row b{color:#dcebee;font-weight:600}
.cash{display:flex;justify-content:space-between;font-size:11px;color:#93a9af;margin:10px 0 12px;padding-top:10px;border-top:1px dashed #2a4148}

/* 엔딩 카드 */
.endcard{text-align:center;padding:8px 4px 4px}
.end-kicker{font-size:9.5px;letter-spacing:.3em;color:var(--acc);opacity:.85;margin-bottom:10px}
.end-title{font-size:21px;font-weight:800;margin:0 0 10px;letter-spacing:-.02em}
.end-body{font-size:12.5px;line-height:1.8;color:#b9cbcf;margin:0 0 16px;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 16px}
.stat{border:1px solid #22343a;border-radius:9px;padding:9px 10px;text-align:left;background:#0a1316}
.stat span{display:block;font-size:9px;letter-spacing:.14em;color:#7a9198;margin-bottom:4px}
.stat b{font-size:13px;color:#dbeaec;font-variant-numeric:tabular-nums}

/* ───────── 컷신 ───────── */
#cine{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;animation:fadeIn .3s}
#cine[hidden]{display:none!important}
#cineStage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
#cineImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .75s ease,transform 9s linear}
#cineImg.on{opacity:1}
#cineImg.zin{transform:scale(1.02)}
#cineImg.zout{transform:scale(1.14)}
#cineImg.pan{transform:scale(1.12) translateX(-2.4%)}
#cineImg.on.zin{transform:scale(1.14)}
#cineImg.on.zout{transform:scale(1.02)}
#cineImg.on.pan{transform:scale(1.14) translateX(2.4%)}
#cineSubWrap{position:absolute;left:0;right:0;bottom:0;padding:48px 20px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.86) 70%)}
#cineSpeaker{display:block;font-size:11px;font-weight:700;color:var(--warm);margin-bottom:6px;letter-spacing:.02em}
#cineText{display:block;font-size:14.5px;line-height:1.7;color:#e8f2f4;text-shadow:0 2px 10px rgba(0,0,0,.9);max-width:760px;margin:0 auto}
#cineTop{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
#cineBar{flex:1;height:2px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden}
#cineBar i{display:block;height:100%;width:0%;background:var(--acc);transition:width .6s linear;opacity:.85}
#cineTop button{font-size:10.5px;color:#b9cdd1;border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 9px;background:rgba(0,0,0,.35)}
#cineEnd{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;
  background:rgba(0,0,0,.9);animation:fadeIn .5s;overflow-y:auto}
#cineEnd[hidden]{display:none!important}
#cineEnd .wrap{width:100%;max-width:420px}

@media (max-width:480px){
  #dialogue{min-height:124px;padding-left:12px;padding-right:12px}
  #line{font-size:13.5px;line-height:1.7}
  .hs{font-size:10px;padding:6px 9px 6px 8px}
  #chapter{font-size:10px;letter-spacing:.1em}
  .hud-btns button{font-size:9.5px;padding:4px 6px}
  #tensionBar{width:42px}
}
@media (max-height:700px){
  #dialogue{min-height:96px}
  #hud{min-height:38px}
}
</style>
</head>
<body>
<div id="app">

  <section id="gate" class="screen">
    <div class="gate-inner">
      <p class="gate-kicker">REAL ESCAPE THRILLER</p>
      <h1>새벽 3시 17분</h1>
      <p class="gate-lead">눈을 떴을 때, 당신은 낯선 수술대 위에 누워 있었다.</p>
      <div class="notice">
        <p>이 작품은 <b>성인 대상 픽션 스릴러</b>입니다. 불법 수술, 장기 거래, 납치·감금을 소재로 한 어두운 이야기를 담고 있습니다.</p>
        <p>갑작스러운 화면 전환(갑툭튀)과 큰 소리, 비명 같은 연출은 <b>사용하지 않습니다.</b> 긴장은 자막과 느린 화면 전환으로만 전달됩니다.</p>
        <p class="warn">만 19세 미만은 플레이할 수 없습니다.</p>
      </div>
      <label class="gate-label" for="dob">생년월일 (YYYY-MM-DD)</label>
      <input id="dob" type="text" inputmode="numeric" autocomplete="bday" maxlength="10" placeholder="1998-04-11">
      <p id="gateMsg" class="gate-msg"></p>
      <button id="gateBtn" class="btn primary" type="button">만 19세 이상입니다 — 시작</button>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <header id="hud">
      <div id="chapter">프롤로그</div>
      <div id="tensionWrap"><span>긴장도</span><div id="tensionBar"><i></i></div></div>
      <div class="hud-btns">
        <button id="btnClues" type="button">단서 0</button>
        <button id="btnHint" type="button">힌트</button>
        <button id="btnSound" type="button">소리 끔</button>
      </div>
    </header>
    <div id="stage">
      <div id="scene">
        <div id="layer">
          <img id="bg" alt="장면">
          <div id="hotspots"></div>
        </div>
      </div>
      <div id="inventory"><span class="inv-empty">소지품 없음</span></div>
      <div id="dialogue">
        <div id="speaker"></div>
        <div id="line"></div>
        <div id="dlgBtns"></div>
        <div id="dlgNext">▼</div>
      </div>
    </div>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-inner">
      <button id="modalClose" type="button" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="cine" hidden>
    <div id="cineStage">
      <img id="cineImg" alt="컷신">
      <div id="cineTop">
        <div id="cineBar"><i></i></div>
        <button id="cineSkip" type="button">건너뛰기</button>
      </div>
      <div id="cineSubWrap"><span id="cineSpeaker"></span><span id="cineText"></span></div>
    </div>
    <div id="cineEnd" hidden><div class="wrap" id="cineEndBody"></div></div>
  </div>

</div>
<script>
(function(){
"use strict";

function sayAll(list){
  for(var i=0;i<list.length;i++){ say(list[i][0], list[i][1], list[i][2]); }
}
function clearTimer(){ if(tmr){ clearInterval(tmr); tmr=null; } }
function clearDlg(){
  clearTimer(); dq=[]; cur=null; typing=false; btnWait=false;
  $("dlgBtns").innerHTML="";
  $("dlgNext").classList.remove("on");
}
function nextLine(){
  clearTimer();
  if(!dq.length){ cur=null; showIdle(); return; }
  cur = dq.shift();
  var spEl = $("speaker");
  spEl.textContent = cur.sp || "";
  spEl.className = spClass(cur.sp);
  $("dlgBtns").innerHTML="";
  $("dlgNext").classList.remove("on");
  btnWait=false;
  startTyping(cur.tx);
}
function startTyping(text){
  typing = true;
  var i=0, lineEl=$("line");
  lineEl.className="";
  lineEl.textContent="";
  lineEl.scrollTop=0;
  clearTimer();
  tmr = setInterval(function(){
    i += 2;
    lineEl.textContent = text.slice(0,i);
    if(i>=text.length){ clearTimer(); typing=false; afterTyped(); }
  }, 16);
}
function finishTyping(){
  clearTimer(); typing=false;
  $("line").textContent = cur.tx;
  afterTyped();
}
function afterTyped(){
  $("dlgBtns").innerHTML="";
  if(cur && (cur.choices || cur.actions)){
    var list = cur.choices || cur.actions;
    btnWait = true;
    for(var i=0;i<list.length;i++){
      (function(idx, item){
        var b=document.createElement("button");
        b.type="button";
        b.className="choice";
        b.innerHTML = (cur.choices ? "<i>"+(idx+1)+"</i>" : "") + item.label;
        b.setAttribute("data-choice", String(idx));
        b.addEventListener("click", function(e){ e.stopPropagation(); pickChoice(idx); });
        $("dlgBtns").appendChild(b);
      })(i, list[i]);
    }
  } else {
    $("dlgNext").classList.add("on");
  }
}
function advance(){
  if(!cur) return;
  if(typing){ finishTyping(); return; }
  if(btnWait) return;
  var node = cur;
  cur = null;
  $("dlgNext").classList.remove("on");
  if(node.after){ node.after(); }
  if(cur) return;
  if(dq.length) nextLine(); else showIdle();
}
function pickChoice(i){
  if(!cur) return;
  var list = cur.choices || cur.actions;
  if(!list || !list[i]) return;
  var fn = list[i].fn;
  cur=null; btnWait=false; typing=false;
  clearTimer();
  dq.length=0;
  $("dlgBtns").innerHTML="";
  $("dlgNext").classList.remove("on");
  if(fn) fn();
  if(!cur && dq.length) nextLine();
  else if(!cur) showIdle();
}
function showIdle(){
  var sc = SCENES[S.scene];
  var sp = $("speaker"); sp.textContent=""; sp.className="";
  var l = $("line");
  l.className="idle";
  var idle = (sc && sc.idle) ? (typeof sc.idle === "function" ? sc.idle() : sc.idle) : "무엇을 살펴볼까.";
  l.textContent = idle;
  $("dlgBtns").innerHTML="";
  $("dlgNext").classList.remove("on");
}

function give(id, note){
  S.items[id]=true;
  if(id==="wallet"){ S.cash = 42000; }
  renderInv();
  if(note){
    var it=ITEMS[id];
    say("나", "[" + it.name + "] 획득. " + note);
  }
}
function has(id){ return !!S.items[id]; }

function clue(title, body){
  for(var i=0;i<S.clues.length;i++){ if(S.clues[i].t===title) return; }
  S.clues.push({t:title, b:body});
  $("btnClues").textContent = "단서 " + S.clues.length;
}
function tension(n){
  S.tension = Math.max(0, Math.min(100, S.tension + n));
  var bar = $("tensionBar").firstChild;
  if(bar) bar.style.width = Math.max(4,S.tension) + "%";
}
function renderInv(){
  var box=$("inventory"); box.innerHTML="";
  var ids=[], k;
  for(k in S.items){ if(S.items[k]) ids.push(k); }
  if(!ids.length){ box.innerHTML='<span class="inv-empty">소지품 없음</span>'; return; }
  for(var i=0;i<ids.length;i++){
    (function(id){
      var it=ITEMS[id]; if(!it) return;
      var b=document.createElement("button");
      b.type="button"; b.className="inv-item";
      b.innerHTML='<span class="ic">'+it.ic+'</span>'+it.name;
      b.addEventListener("click", function(){ itemInfo(id); });
      box.appendChild(b);
    })(ids[i]);
  }
}
function itemInfo(id){
  var it=ITEMS[id]; if(!it) return;
  var extra="";
  if(id==="ticket" && S.ticket){
    extra="\n\n"+S.ticket.dest+"행 · "+S.ticket.time+" 출발 · "+S.ticket.platform+"번 승차홈";
  }
  openModal(
    '<h3 class="m-title">'+it.ic+' '+it.name+'</h3><p class="m-text">'+esc(it.desc+extra)+'</p>'+
    '<button class="btn" data-a="close">닫기</button>',
    {close:closeModal}
  );
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ══════════════ 장면 ══════════════ */
function goScene(id){
  S.scene = id;
  var sc = SCENES[id];
  $("scene").style.setProperty("--ar", sc.ratio || 1.7778);
  var bgEl = $("bg");
  bgEl.src = IMG[sc.bg];
  bgEl.classList.remove("fadein");
  void bgEl.offsetWidth;
  bgEl.classList.add("fadein");
  $("chapter").textContent = sc.chapter;
  $("layer").classList.remove("zoom");
  $("layer").style.transformOrigin = "50% 50%";
  layoutScene();
  clearDlg();
  renderHs();
  if(sc.enter) sc.enter();
  else showIdle();
}

/* 무대 크기: 남은 공간에 맞춰 이미지 비율을 유지한 채 꽉 채운다 */
function layoutScene(){
  var st = $("stage"), sc = $("scene");
  if(!st || !sc) return;
  var H = st.clientHeight || 0, W = st.clientWidth || 0;
  if(H < 80 || W < 80) return;              /* 화면이 숨겨진 상태 */
  var inv = $("inventory");
  var invH = (inv && inv.offsetHeight) ? inv.offsetHeight : 44;
  var dlgMin = H < 600 ? 96 : 124;         /* 대사창 최소 높이 */
  var ar = parseFloat(sc.style.getPropertyValue("--ar")) || 1.7778;
  var availH = Math.max(110, H - invH - dlgMin);
  var w = Math.min(W, availH * ar);
  sc.style.width = Math.floor(w) + "px";
  sc.style.height = Math.floor(w / ar) + "px";
}
function renderHs(){
  var box = $("hotspots"); box.innerHTML="";
  var sc = SCENES[S.scene]; if(!sc) return;
  for(var i=0;i<sc.hs.length;i++){
    (function(h){
      if(h.show && !h.show()) return;
      var b=document.createElement("button");
      b.type="button";
      b.className = "hs" + (S.seen[h.id] ? " seen" : "") + (h.hot ? " hot" : "");
      b.style.left = h.x + "%";
      b.style.top  = h.y + "%";
      /* 화면 끝에서는 라벨이 잘리지 않도록 기준점을 바꿔 붙인다 */
      var tx = h.x < 13 ? 0 : (h.x > 87 ? -100 : -50);
      var ty = h.y < 10 ? 0 : (h.y > 90 ? -100 : -50);
      b.style.transform = "translate(" + tx + "%, " + ty + "%)";
      b.textContent = h.label;
      b.setAttribute("data-hs", h.id);
      b.addEventListener("click", function(e){ if(e && e.stopPropagation) e.stopPropagation(); tapHs(h.id); });
      box.appendChild(b);
    })(sc.hs[i]);
  }
}
function tapHs(id){
  if(btnWait) return;            /* 선택지 응답 대기 중에는 무시 */
  var h = findHs(id); if(!h) return;
  sClick();
  S.seen[id]=true;
  h.act();
  renderHs();
}
function needFreed(){
  if(!S.flags.freed){
    say("나","벨트에 묶여 있다. 몸을 일으킬 수 없다. 먼저 손목을 자유롭게 해야 한다.");
    return true;
  }
  return false;
}

/* ══════════════ 사운드 (기본 꺼짐 · 아주 작게) ══════════════ */
var actx=null, droneGain=null, soundOn=false;
function toggleSound(){
  soundOn = !soundOn;
  $("btnSound").textContent = soundOn ? "소리 켬" : "소리 끔";
  $("btnSound").classList.toggle("on", soundOn);
  if(soundOn){ startDrone(); } else { stopDrone(); }
}
function startDrone(){
  try{
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      actx = new AC();
    }
    if(actx.state === "suspended") actx.resume();
    if(droneGain) return;
    droneGain = actx.createGain();
    droneGain.gain.value = 0.0;
    var filt = actx.createBiquadFilter();
    filt.type="lowpass"; filt.frequency.value=220;
    var o1 = actx.createOscillator(); o1.type="sine"; o1.frequency.value=54;
    var o2 = actx.createOscillator(); o2.type="sine"; o2.frequency.value=81.5;
    var g2 = actx.createGain(); g2.gain.value=0.35;
    o1.connect(filt); o2.connect(g2); g2.connect(filt); filt.connect(droneGain); droneGain.connect(actx.destination);
    o1.start(); o2.start();
    droneGain.gain.linearRampToValueAtTime(0.018, actx.currentTime + 3.0);
  }catch(e){}
}
function stopDrone(){
  try{
    if(droneGain && actx){
      droneGain.gain.cancelScheduledValues(actx.currentTime);
      droneGain.gain.linearRampToValueAtTime(0, actx.currentTime + 1.2);
      var g = droneGain;
      setTimeout(function(){ try{ g.disconnect(); }catch(e){} }, 1400);
      droneGain = null;
    }
  }catch(e){}
}
function sClick(){
  if(!soundOn || !actx) return;
  try{
    var o=actx.createOscillator(), g=actx.createGain();
    o.type="sine"; o.frequency.value=430;
    g.gain.value=0.0001;
    o.connect(g); g.connect(actx.destination);
    var t=actx.currentTime;
    g.gain.linearRampToValueAtTime(0.02, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
    o.start(t); o.stop(t+0.11);
  }catch(e){}
}

function openKiosk(){

  function list(){

      '<p class="kiosk-title">행선지를 선택하세요</p>'+

    if(msg) html += '<p class="m-sub err-msg">' + esc(msg) + '</p>';
    for(var i=0;i<DESTS.length;i++){
      var d = DESTS[i];
      html += '<button class="dest' + (d.soldout ? " off" : "") + '" data-a="d' + i + '">' +
        '<span><span class="d1">' + d.name + '</span><span class="d2">' +
        (d.soldout ? ("출발 정보 없음 · " + d.note) : (d.time + " 출발 · " + d.note)) +
        '</span></span><span class="d3">' + (d.soldout ? "매진" : won(d.price)) + '</span></button>';
    }
    html += '<button class="btn" data-a="close">발권 취소</button></div>';
    openModal(html, acts);
  }

  function confirmDest(d){
    if(S.cash < d.price){ msg = "보유 현금이 부족합니다."; list(); return; }
    var html = '<div class="kiosk">'+
      '<div class="kiosk-top"><span>결제 확인</span><span>현금 전용</span></div>'+
      '<div class="ticket"><div class="t1">INTERCITY · BOARDING PASS</div><div class="t2">'+d.name+'</div>'+
      '<div class="row"><span>출발</span><b>'+d.time+'</b></div>'+
      '<div class="row"><span>승차홈</span><b>3번</b></div>'+
      '<div class="row"><span>인원</span><b>성인 1명</b></div></div>'+
      '<div class="cash"><span>투입할 현금</span><b>'+won(d.price)+'</b></div>'+
      '<div class="cash"><span>발권 후 잔액</span><b>'+won(S.cash - d.price)+'</b></div>'+
      '<button class="btn primary" data-a="pay">현금을 넣고 발권한다</button>'+
      '<button class="btn" data-a="back">행선지 다시 선택</button></div>';
    openModal(html, {
      pay: function(){ issue(d); },
      back: function(){ msg=""; list(); }
    });
  }

  function issue(d){
    S.cash -= d.price;
    S.ticket = {dest:d.name, time:d.time, platform:3, price:d.price, id:"0417"};
    ITEMS.ticket.desc = d.name + "행 승차권. " + d.time + " 출발, 3번 승차홈. 좌석 12.";
    give("ticket");
    clue("승차권", d.name + "행 · " + d.time + " 출발 · 3번 승차홈. 현금 " + won(d.price) + " 결제.");
    closeModal();
    sayAll([
      ["나","지폐를 밀어 넣는다. 기계가 천천히 지폐를 세는 소리."],
      ["나","'발권 중' — 짧은 기계음과 함께 승차권이 밀려 나온다."],
      ["나", d.name + "행, " + d.time + " 출발. 3번 승차홈."]
    ]);
  }

  var acts = { close: function(){ closeModal(); } };
  for(var i=0;i<DESTS.length;i++){
    (function(d){
      acts["d" + DESTS.indexOf(d)] = function(){
        if(d.soldout){ msg = "해당 행선지는 매진입니다. 다른 행선지를 선택하세요."; sClick(); list(); return; }
        confirmDest(d);
      };
    })(DESTS[i]);
  }
  list();
}

var CINE = null, cineTok = 0, cineTimers = [];

function clearCineTimers(){
  for(var i=0;i<cineTimers.length;i++){ clearTimeout(cineTimers[i]); }
  cineTimers = [];
}
function ct(fn, ms){
  var tok = cineTok;
  cineTimers.push(setTimeout(function(){ if(tok === cineTok){ fn(); } }, ms));
}

function playCine(shots, opts){
  cineTok++;
  CINE = {shots:shots, opts:opts||{}, i:0, li:0};
  clearCineTimers();
  $("cine").hidden = false;
  $("cineEnd").hidden = true;
  $("cineEndBody").innerHTML = "";
  $("cineBar").firstChild.style.width = "0%";
  showShot();
}

function showShot(){
  if(!CINE) return;
  var s = CINE.shots[CINE.i];
  var img = $("cineImg");
  img.className = "";
  img.src = IMG[s.img];
  var self = img;
  ct(function(){ self.className = (s.move || "zin"); ct(function(){ self.classList.add("on"); }, 40); }, 20);
  $("cineBar").firstChild.style.width = Math.round(100 * CINE.i / CINE.shots.length) + "%";
  CINE.li = 0;
  showCineLine();
}

function showCineLine(){
  if(!CINE) return;
  var s = CINE.shots[CINE.i];
  var L = s.lines[CINE.li];
  var sp = $("cineSpeaker"), tx = $("cineText");
  sp.textContent = L.sp || "";
  sp.className = spClass(L.sp);
  tx.textContent = L.tx;
  ct(function(){
    if(!CINE) return;
    CINE.li++;
    if(CINE.li < s.lines.length){ showCineLine(); }
    else {
      CINE.i++;
      if(CINE.i < CINE.shots.length){ fadeOutShot(); }
      else { finishCine(); }
    }
  }, L.dur || 3400);
}

function fadeOutShot(){
  var img = $("cineImg");
  img.classList.remove("on");
  ct(function(){ showShot(); }, 640);
}

function finishCine(){
  if(!CINE) return;
  clearCineTimers();
  var e = CINE.opts.ending || {};
  var shots = CINE.shots, opts = CINE.opts;
  $("cineBar").firstChild.style.width = "100%";
  $("cineEnd").hidden = false;
  var btns = (e.buttons || []).slice();
  btns.push({label:"컷신 다시 보기", fn:function(){ playCine(shots, opts); }});
  CINE.btns = btns;
  $("cineEndBody").innerHTML =
    '<div class="endcard"><div class="end-kicker">' + esc(e.kicker || "ENDING") + '</div>' +
    '<h2 class="end-title">' + esc(e.title || "") + '</h2>' +
    '<p class="end-body">' + esc(e.body || "") + '</p>' +
    statsHtml() + '<div id="cineBtns"></div></div>';
  var box = $("cineBtns");
  for(var i=0;i<btns.length;i++){
    (function(idx){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn" + (idx === 0 ? " primary" : "");
      b.textContent = btns[idx].label;
      b.addEventListener("click", function(){ btns[idx].fn(); });
      box.appendChild(b);
    })(i);
  }
}

function skipCine(){ if(CINE) finishCine(); }
function closeCine(){ clearCineTimers(); $("cine").hidden = true; $("cineEnd").hidden = true; }

function statsHtml(){
  var secs = Math.max(0, Math.round((Date.now() - (S.t0 || Date.now())) / 1000));
  var mm = Math.floor(secs / 60), ss = secs % 60;
  var t = S.tension >= 60 ? "높음" : (S.tension >= 30 ? "보통" : "낮음");
  return '<div class="stats">' +
    '<div class="stat"><span>단서</span><b>' + S.clues.length + '개</b></div>' +
    '<div class="stat"><span>힌트</span><b>' + S.hintTotal + '회</b></div>' +
    '<div class="stat"><span>긴장도</span><b>' + t + '</b></div>' +
    '<div class="stat"><span>플레이 시간</span><b>' + mm + '분 ' + ss + '초</b></div>' +
    '</div>';
}

function hintKey(){
  var f = S.flags;
  if(S.scene === "s1"){
    if(!f.freed) return has("scalpel") ? "s1_cut" : "s1_scalpel";
    if(!f.codeKnown) return "s1_fridge";
    if(!f.doorOpen) return "s1_keypad";
    return null;
  }
  if(S.scene === "s1f") return f.codeKnown ? null : "s1f_label";
  if(S.scene === "s2"){
    if(!has("key")) return "s2_key";
    if(!has("wallet")) return "s2_locker";
    if(!f.exitPower) return "s2_power";
    return "s2_exit";
  }
  if(S.scene === "s3") return "s3_route";
  if(S.scene === "police") return "police";
  if(S.scene === "s4") return S.ticket ? "s4_board" : "s4_ticket";
  return null;
}

function hint(){
  var k = hintKey();
  if(!k){ say("힌트","지금은 막힌 곳이 없어 보인다. 화면의 표시를 따라가 보자."); return; }
  var n = S.hints[k] || 0;
  S.hints[k] = n + 1;
  S.hintTotal++;
  var pair = HINT_TABLE[k];
  say("힌트", pair[Math.min(n, pair.length - 1)]);
}

function showClues(){
  var html = '<h3 class="m-title">단서 수첩</h3>';
  if(!S.clues.length){
    html += '<p class="m-sub">아직 기록한 단서가 없다. 장면의 표시를 눌러 조사해 보자.</p>';
  } else {
    html += '<p class="m-sub">조사하면서 알게 된 것들 · ' + S.clues.length + '개</p>';
    for(var i=0;i<S.clues.length;i++){
      html += '<div class="clue"><b>' + esc(S.clues[i].t) + '</b><span>' + esc(S.clues[i].b) + '</span></div>';
    }
  }
  html += '<button class="btn" data-a="close">닫기</button>';
  openModal(html, {close:closeModal});
}

/* ══════════════ 입장 · 연령 확인 ══════════════ */

function checkDob(v){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || "").trim());
  if(!m) return {ok:false, msg:"생년월일을 YYYY-MM-DD 형식으로 입력해 주세요."};
  var y = +m[1], mo = +m[2], d = +m[3];
  var dt = new Date(y, mo - 1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d)
    return {ok:false, msg:"존재하지 않는 날짜입니다. 다시 확인해 주세요."};
  var now = new Date();
  if(dt.getTime() > now.getTime())
    return {ok:false, msg:"생년월일이 오늘 이후입니다. 다시 확인해 주세요."};
  var age = now.getFullYear() - y;
  var passed = (now.getMonth() > mo - 1) || (now.getMonth() === mo - 1 && now.getDate() >= d);
  if(!passed) age--;
  if(age > 110) return {ok:false, msg:"생년월일을 다시 확인해 주세요."};
  if(age < 19) return {ok:false, msg:"만 19세 미만은 플레이할 수 없습니다. (현재 만 " + age + "세)"};
  return {ok:true, dob:v, age:age};
}

function onDobInput(){
  var inp = $("dob");
  var d = inp.value.replace(/[^0-9]/g, "").slice(0, 8);
  var out = d;
  if(d.length > 4) out = d.slice(0,4) + "-" + d.slice(4);
  if(d.length > 6) out = d.slice(0,4) + "-" + d.slice(4,6) + "-" + d.slice(6);
  inp.value = out;
  var msg = $("gateMsg");
  if(d.length === 8){
    var r = checkDob(out);
    msg.textContent = r.ok ? ("만 " + r.age + "세 · 시작할 수 있습니다.") : r.msg;
    msg.className = "gate-msg" + (r.ok ? " ok" : "");
  } else {
    msg.textContent = ""; msg.className = "gate-msg";
  }
}

function startGame(){
  var r = checkDob($("dob").value);
  var msg = $("gateMsg");
  if(!r.ok){ msg.textContent = r.msg; msg.className = "gate-msg"; return; }
  S.dob = r.dob; S.t0 = Date.now();
  $("gate").hidden = true;
  $("game").hidden = false;
  renderInv();
  goScene("s1");
}

var kpCode = "";
function openKeypad(){
  if(S.flags.doorOpen){ return; }
  kpCode = "";
  var acts = {};
  var dig = ["1","2","3","4","5","6","7","8","9","0"];

  function redraw(err){
    var disp = kpCode.length ? kpCode.replace(/[0-9]/g, "●") : "────";
    var html = '<h3 class="m-title">철문 키패드</h3><p class="m-sub">4자리 숫자를 입력한다.</p>' +
      '<div class="kp"><div class="kp-screen' + (err ? " err" : "") + '">' + disp + '</div>' +
      '<div class="keys">';
    for(var i=0;i<9;i++){ html += '<button data-a="k' + dig[i] + '">' + dig[i] + '</button>'; }
    html += '<button data-a="del" class="wide">지우기</button>';
    html += '<button data-a="k0">0</button>';
    html += '<button data-a="ok" class="wide">확인</button>';
    html += '</div>';
    if(err) html += '<p class="m-sub err-msg" style="margin-top:12px">삐— 붉은 불이 한 번 깜빡인다. 숫자가 틀렸다.</p>';
    html += '</div>';
    openModal(html, acts);
  }

  for(var i=0;i<10;i++){
    (function(n){
      acts["k" + n] = function(){
        if(kpCode.length < 4){ kpCode += n; sClick(); redraw(false); }
      };
    })(dig[i]);
  }
  acts.del = function(){ kpCode = kpCode.slice(0,-1); sClick(); redraw(false); };
  acts.ok = function(){
    if(kpCode.length < 4) return;
    if(kpCode === "0417"){ closeModal(); doorOpen(); }
    else { kpCode = ""; tension(2); sClick(); redraw(true); }
  };
  redraw(false);
}

function doorOpen(){
  S.flags.doorOpen = true;
  sayAll([
    ["나","네 자리를 누르고, 마지막에 확인음을 누른다."],
    ["나","짧은 삐 소리. 그리고 철문 안쪽에서 걸쇠가 풀리는 소리."],
    ["나","문이 안쪽으로 조금 열린다. 복도 불빛이 바닥에 길게 누워 있다."]
  ]);
  say("나","나간다.", {after:function(){ goScene("s2"); }});
}

/* ══════════════ 초기화 ══════════════ */

function zoomTap(e){
  var L = $("layer");
  if(L.classList.contains("zoom")){ L.classList.remove("zoom"); return; }
  var r = this.getBoundingClientRect ? this.getBoundingClientRect() : null;
  if(!r || !r.width) return;
  var x = ((e.clientX - r.left) / r.width) * 100;
  var y = ((e.clientY - r.top) / r.height) * 100;
  L.style.transformOrigin = Math.max(0,Math.min(100,x)) + "% " + Math.max(0,Math.min(100,y)) + "%";
  L.classList.add("zoom");
}

function init(){
  $("gateBtn").addEventListener("click", startGame);
  var dob = $("dob");
  dob.addEventListener("input", onDobInput);
  dob.addEventListener("keydown", function(e){ if(e.key === "Enter") startGame(); });

  $("dialogue").addEventListener("click", function(e){
    if(e.target && e.target.closest && e.target.closest("button")) return;
    advance();
  });
  $("btnClues").addEventListener("click", showClues);
  $("btnHint").addEventListener("click", hint);
  $("btnSound").addEventListener("click", toggleSound);

  $("modalClose").addEventListener("click", closeModal);
  $("modal").addEventListener("click", function(e){ if(e.target === this) closeModal(); });
  $("modalBody").addEventListener("click", function(e){
    var el = e.target;
    while(el && el !== this){
      if(el.dataset && el.dataset.a){ modalTap(el.dataset.a, el); return; }
      el = el.parentNode;
    }
  });

  $("cineSkip").addEventListener("click", skipCine);
  $("bg").addEventListener("click", zoomTap);

  if(typeof window.addEventListener === "function"){
    window.addEventListener("resize", layoutScene);
    window.addEventListener("orientationchange", function(){ setTimeout(layoutScene, 180); });
  }

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(!$("modal").hidden) closeModal();
      return;
    }
    if((e.key === "Enter" || e.key === " ") && $("modal").hidden && $("cine").hidden){
      e.preventDefault();
      advance();
    }
  });

  renderInv();
}

if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", init); }
else { init(); }

/* ══════════════ 검증용 API ══════════════ */

      line: $("line").textContent
    };
  },
  cineClick: function(i){ if(CINE && CINE.btns && CINE.btns[i]) CINE.btns[i].fn(); },
  layout: layoutScene,
  pump: function(ms){ if(typeof __pump === "function") __pump(ms); }
};
